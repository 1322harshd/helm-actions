name: Publish action image
on:
    push:
        branches:
            - main
        paths:
            - 'base-image/**'
            - .github/workflows/publish-action-image.yml

permissions:
    contents: read
    packages: write

jobs: 
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.1.0
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v2
              with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push helm base image
              run: |
                docker build -t ghcr.io/${{ github.repository_owner }}/helm-actions:latest ./action
                docker push ghcr.io/${{ github.repository_owner }}/helm-actions:latest